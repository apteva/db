name: soak

# A nightly soak: concurrent writers, readers, joins on snapshots, index
# builds, compactions, backups and crash-recovery phases for an hour, with
# the whole database checked against the writers' models at every phase.
# Also runnable on demand with a duration of your choosing.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "how long to run, as a Go duration"
        default: "60m"
        required: true

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - name: cursor stress
        env:
          CURSOR_STRESS: 10m
          GOTRACEBACK: all
        run: go test -count=1 -timeout 25m -run '^TestCursorStress$' -v . 2>&1 | grep -E "^(--- |ok|FAIL|panic|fatal error|unexpected fault)"
      - name: soak
        env:
          SOAK: ${{ github.event.inputs.duration || '60m' }}
          GOTRACEBACK: all
        run: go test -count=1 -timeout 110m -run '^TestSoak$' -v . 2>&1 | grep -E "soak_test|^(--- |ok|FAIL|panic|fatal error|unexpected fault)"
