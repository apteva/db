name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - run: go version
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test -count=1 -timeout 20m ./...
      - name: benchmark harness builds
        # its own module: Pebble and the SQLite bindings stay out of the engine's graph
        run: |
          cd bench
          go vet ./...
          go build ./...
          cd aggregation_memory
          go vet ./...
          go build ./...
          cd ../spill_groups
          go vet ./...
          go build ./...

  race:
    name: race detector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - name: race pass
        run: go test -race -count=1 -timeout 45m ./...
      - name: change feed stress
        env:
          CHANGE_FEED_STRESS: 2m
        run: go test -race -count=1 -timeout 10m -run '^TestChangeFeedStress$' .

  fuzz:
    name: fuzz smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: bench/go.sum
      - name: documents
        run: go test -run='^$' -fuzz='^FuzzDocument$' -fuzztime=45s .
      - name: pipelines
        run: go test -run='^$' -fuzz='^FuzzPipeline$' -fuzztime=45s .
      - name: pages
        run: go test -run='^$' -fuzz='^FuzzPage$' -fuzztime=45s .
      - name: wide page splits
        run: go test -run='^$' -fuzz='^FuzzWidePageSplit$' -fuzztime=45s .

      - name: change markers
        run: go test -run='^$' -fuzz='^FuzzChangeMarker$' -fuzztime=45s .
